<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta name="description" content="Don't know who Anchor really is? Click here to find out!">
    <meta name="theme-color" content="#08090d">
    <meta property="og:title" content="Anchor files">

    <meta property="og:type" content="website">
    <title>Anchor files</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="is-locked">
    <main class="files-shell" aria-labelledby="files-title">
      <header class="files-header">
        <div>
          <h1 id="files-title">Anchor files</h1>
          <p>Don't know who Anchor really is? Click here to find out!</p>
        </div>
      </header>

      <section class="files-viewer" aria-label="Anchor files screenshots">
        <button class="slider-button slider-button--prev" type="button" aria-label="Previous screenshot">&#8249;</button>
        <div class="files-slider" tabindex="0"></div>
        <button class="slider-button slider-button--next" type="button" aria-label="Next screenshot">&#8250;</button>
        <div class="zoom-controls" aria-label="Zoom controls">
          <button class="zoom-button zoom-button--out" type="button" aria-label="Zoom out">-</button>
          <button class="zoom-button zoom-button--reset" type="button" aria-label="Reset zoom">100%</button>
          <button class="zoom-button zoom-button--in" type="button" aria-label="Zoom in">+</button>
        </div>
      </section>

      <footer class="files-footer">
        <span class="slide-count" aria-live="polite">1 / 1</span>
        <div class="slide-dots" aria-label="Screenshot navigation"></div>
      </footer>
    </main>

    <button class="unlock-panel" type="button">
